# Deploy, for the Orbiters hub only. Same shape as `deploy-website.yml` and, like it,
# deliberately its own file: two projects in this monorepo must never be able to deploy
# each other. The mechanism is `_deploy-compose.yml`; this file is the two rules that
# say when and the four values that say where.
#
# Preview when CI goes green on main, production on a version tag:
#
#     git tag hub-v0.1.0 && git push origin hub-v0.1.0
#
# The tag deploys the commit it points at, and `_deploy-compose.yml` refuses any commit
# whose `ci.yml` run is not green. Both environments stay off until their arming
# variable exists: `vars.HUB_PREVIEW_ENABLED` and `vars.HUB_DEPLOY_ENABLED`.
#
# The production compose project is `orbiters`, not `hub`: that is the name the stack
# went up under by hand on 2026-09-09 (ORB-17), its Postgres data sits under it, and a
# different name here would start a second stack beside the running one.
name: Deploy hub

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ['hub-v*']

permissions:
  contents: read
  actions: read

jobs:
  # A push that touched only another project must not rebuild this stack. `ci.yml`'s
  # `changes` job decided that already, from the same paths that select the hub image
  # build, and published it; this reads the answer.
  scope:
    if: |
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.decide.outputs.changed }}
    steps:
      # Fail open: a missing verdict deploys rather than skips.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: changed-paths
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - id: decide
        env:
          PROJECT: hub
        run: |
          set -euo pipefail
          if [ ! -f changed-paths.json ]; then
            echo "no verdict from CI run ${{ github.event.workflow_run.id }}; deploying rather than skipping"
            echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          cat changed-paths.json
          all=$(jq -r '.all // ""' changed-paths.json)
          mine=$(jq -r --arg p "$PROJECT" '.[$p] // ""' changed-paths.json)
          if [ "$all" = true ] || [ "$mine" = true ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  preview:
    needs: scope
    if: |
      needs.scope.outputs.changed == 'true' &&
      vars.HUB_PREVIEW_ENABLED == 'true'
    concurrency:
      group: deploy-hub-preview
      cancel-in-progress: true
    uses: ./.github/workflows/_deploy-compose.yml
    with:
      environment: hub-preview
      compose-dir: projects/hub
      compose-project: orbiters-preview
      ref: ${{ github.event.workflow_run.head_sha }}
      # The API's probe touches the database (SELECT 1), so a green deploy means
      # Postgres is up and migrated, not only that uvicorn answered.
      health-url: http://127.0.0.1:8086/health
      url: https://joinorbiters.com/hub/
    secrets: inherit

  production:
    if: |
      startsWith(github.ref, 'refs/tags/hub-v') &&
      vars.HUB_DEPLOY_ENABLED == 'true'
    concurrency:
      group: deploy-hub-production
      cancel-in-progress: false
    uses: ./.github/workflows/_deploy-compose.yml
    with:
      environment: hub-production
      compose-dir: projects/hub
      compose-project: orbiters
      health-url: http://127.0.0.1:8084/health
      url: https://joinorbiters.com/hub/
    secrets: inherit
