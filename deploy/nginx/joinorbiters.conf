# joinorbiters.com -- the Orbiters page, the PigroCRM landing at /pigrocrm, and
# nothing else from the stack behind it.
#
# The PigroCRM compose stack (docker-compose.yml) listens on 127.0.0.1:8080 and serves
# the whole landing plus the CRM at /app/ and the whole API at /api/. On this name the
# CRM is not reachable: it lives on pigro.joinorbiters.com (pigro.joinorbiters.conf),
# and /app here sends the visitor there. What this vhost exposes is the Orbiters page,
# the PigroCRM landing, the static assets they need, the two policy pages they link,
# and the one endpoint the Orbiters form posts to. Everything else is a 404.
#
# TLS is added by `certbot --nginx`, which rewrites this file in place.

server {
    listen 80;
    listen [::]:80;
    server_name www.joinorbiters.com;
    return 301 https://joinorbiters.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name joinorbiters.com;

    absolute_redirect off;

    location = /                     { proxy_pass http://127.0.0.1:8080/orbiters; include /etc/nginx/snippets/orbiters-proxy.conf; }
    location = /orbiters             { return 301 /; }
    location = /pigrocrm             { proxy_pass http://127.0.0.1:8080/pigrocrm; include /etc/nginx/snippets/orbiters-proxy.conf; }
    location = /privacy              { proxy_pass http://127.0.0.1:8080/privacy;  include /etc/nginx/snippets/orbiters-proxy.conf; }
    location = /termini              { proxy_pass http://127.0.0.1:8080/termini;  include /etc/nginx/snippets/orbiters-proxy.conf; }
    location /assets/                { proxy_pass http://127.0.0.1:8080/assets/;  include /etc/nginx/snippets/orbiters-proxy.conf; }
    location = /api/orbiters/signups { proxy_pass http://127.0.0.1:8080/api/orbiters/signups; include /etc/nginx/snippets/orbiters-proxy.conf; }
    location = /health               { proxy_pass http://127.0.0.1:8080/health;   include /etc/nginx/snippets/orbiters-proxy.conf; }

    # "Accedi" on both pages: the CRM answers on its own name.
    location = /app                  { return 302 https://pigro.joinorbiters.com/app/; }
    location /app/                   { return 302 https://pigro.joinorbiters.com$request_uri; }

    location / { return 404; }
}
