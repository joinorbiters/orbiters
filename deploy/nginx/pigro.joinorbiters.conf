# pigro.joinorbiters.com -- the CRM itself, the whole compose stack under one name.
#
# Everything the stack on 127.0.0.1:8080 serves passes through: the SPA at /app/,
# the API at /api/, the hashed assets, the policy pages. The one thing this name does
# not do is show the landing at its root: that page lives at joinorbiters.com/pigrocrm,
# so a visitor who types the CRM's name lands in the CRM.
#
# TLS is added by `certbot --nginx`, which rewrites this file in place.

server {
    listen 80;
    listen [::]:80;
    server_name pigro.joinorbiters.com;

    absolute_redirect off;

    # The root installation's own space name (PIGROCRM_ROOT_SLUG=humancraft on this
    # server): the bare host and the unprefixed login land there, so the titolare's CRM
    # has an address shaped like everyone else's. Deep links and assets under /app/ keep
    # working unprefixed -- the same SPA, the same database.
    location = /          { return 302 /humancraft/app/; }
    location = /app       { return 302 /humancraft/app/; }
    # Every page under /app/ moves under the root's name, so the session cookie (scoped
    # to /humancraft/) is always sent; the bundle's assets and the tab icon are the two
    # things under /app/ that are not pages, and longest-prefix wins for them.
    location ^~ /app/assets/ {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/orbiters-proxy.conf;
    }
    location = /app/mark.svg {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/orbiters-proxy.conf;
    }
    location ^~ /app/ { return 302 /humancraft$request_uri; }

    location / {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/orbiters-proxy.conf;
    }
}
