[project]
name = "pigrocrm-core"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "sqlalchemy==2.0.51",
  "alembic==1.19.0",
  "psycopg[binary]==3.3.4",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "email-validator==2.3.0",
  "argon2-cffi==25.1.0",
  # The `crypto` extra pulls in `cryptography`, needed for the RS256 assertion a
  # Google service account signs to obtain an access token (storage/gdrive.py). The
  # architecture test resolves this entry to the module root `jwt` through
  # DIST_TO_MODULE_OVERRIDES and strips the extra exactly as it already does for
  # `psycopg[binary]`, so no test change is needed.
  "pyjwt[crypto]==2.13.0",
  "uuid-utils==0.17.0",
  "lxml==6.1.2",
]

[project.scripts]
pigrocrm = "pigrocrm.core.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pigrocrm"]

# No `force-include` entry for `render/assets` here, on purpose, despite the task
# brief's own sample suggesting one: hatchling's default wheel builder already
# bundles every non-Python file living under `packages` above (confirmed by
# unzipping a real build -- `pigrocrm/core/render/assets/**`, media PNGs included,
# was already present with no extra section at all). Adding the brief's suggested
# `[tool.hatch.build.targets.wheel.force-include]` on top of that duplicate-includes
# the same files and fails the build outright ("A second file is being added to the
# wheel archive at the same path") -- confirmed live, not merely redundant.
