[project]
name = "orbiters-api"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "orbiters-core", "fastapi==0.141.1", "uvicorn[standard]==0.52.1",
  "python-multipart==0.0.20",
]

[tool.uv.sources]
orbiters-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orbiters_api"]
