[project]
name = "orbiters-mcp"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["orbiters-core", "mcp==2.0.0"]

[tool.uv.sources]
orbiters-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orbiters_mcp"]
