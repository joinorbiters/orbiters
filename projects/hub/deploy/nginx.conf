# The hub's own nginx, inside its own image: the SPA under /hub/ and nothing else. The
# host's nginx (projects/website/deploy/joinorbiters.conf) terminates TLS and sends
# `/hub/` here and `/api/hub/`, `/api/orbiters/signups` to the hub's API.
server {
    listen 80;
    root /usr/share/nginx/html;
    absolute_redirect off;

    location = /hub { return 302 /hub/; }
    # Hashed assets by their exact name; every other path under /hub/ is the SPA, which
    # routes it itself.
    location ^~ /hub/assets/ { try_files $uri =404; }
    location = /hub/mark.svg { try_files $uri =404; }
    location ^~ /hub/ { try_files $uri /hub/index.html; }

    location / { return 404; }
}
