# The Orbiters hub: its own Postgres, its own API, its own SPA. Run with `-p orbiters`
# so the project name never derives from the directory (docs/adding-a-project.md §7).
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orbiters}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?serve una password}
      POSTGRES_DB: ${POSTGRES_DB:-orbiters}
    # On the host, never in a Docker-managed volume: the same decision PigroCRM took
    # after a daemon reset scared everyone. Set ORBITERS_DATA_DIR outside the repository.
    #
    # No default, on purpose. Two stacks of this file run on one host, and each has its
    # own data directory; a `.env` that forgets the variable must fail here, loudly,
    # rather than bring Postgres up on an empty relative directory with `/health`
    # answering 200 and the real rows unmounted (ORB-28). A build never mounts it, but
    # compose interpolates the whole file before building, so `docker compose build`
    # needs a value too: CI and preflight pass a throwaway one.
    volumes:
      - ${ORBITERS_DATA_DIR:?set it in .env, to this stack's own directory outside the repository}:/var/lib/postgresql/data
    ports:
      - '${ORBITERS_DB_PORT:-127.0.0.1:55435}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-orbiters}']
      interval: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: projects/hub/Dockerfile.api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ORBITERS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-orbiters}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-orbiters}
      # ChatGPT Ads, the server half of the signup conversion. Empty defaults: a site
      # that runs no campaigns is the ordinary case, not a start-up failure.
      ORBITERS_OPENAI_PIXEL_ID: ${ORBITERS_OPENAI_PIXEL_ID:-}
      ORBITERS_OPENAI_CONVERSIONS_API_KEY: ${ORBITERS_OPENAI_CONVERSIONS_API_KEY:-}
      ORBITERS_SIGNUP_URL: ${ORBITERS_SIGNUP_URL:-https://joinorbiters.com/}
      ORBITERS_OPENAI_CONVERSIONS_SEND_HASHED_EMAIL: ${ORBITERS_OPENAI_CONVERSIONS_SEND_HASHED_EMAIL:-false}
      # The member area's mail. Empty key is a hub with the area's door still closed.
      ORBITERS_RESEND_API_KEY: ${ORBITERS_RESEND_API_KEY:-}
      ORBITERS_MAIL_FROM: ${ORBITERS_MAIL_FROM:-Orbiters <ciao@joinorbiters.com>}
      ORBITERS_HUB_URL: ${ORBITERS_HUB_URL:-https://joinorbiters.com/hub}
      # PigroCRM's spaces in the admin area (ORB-142): the CRM's public URL, and the
      # token its own `.env` carries as PIGROCRM_REGISTRY_TOKEN. Empty token: 503.
      ORBITERS_PIGRO_API_URL: ${ORBITERS_PIGRO_API_URL:-https://pigro.joinorbiters.com}
      ORBITERS_PIGRO_REGISTRY_TOKEN: ${ORBITERS_PIGRO_REGISTRY_TOKEN:-}
    ports:
      # Loopback only: the host's nginx is what faces the internet, and it proxies
      # `/api/orbiters/signups` and `/api/hub/` here.
      - '${ORBITERS_API_PORT:-127.0.0.1:8084}:8000'

  web:
    build:
      context: ../..
      dockerfile: projects/hub/Dockerfile.web
    restart: unless-stopped
    ports:
      # The SPA, at /hub/. The host's nginx proxies `/hub/` here.
      - '${ORBITERS_WEB_PORT:-127.0.0.1:8085}:80'
