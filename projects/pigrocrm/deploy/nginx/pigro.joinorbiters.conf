# pigro.joinorbiters.com -- the CRM itself, the whole compose stack under one name.
#
# Everything the stack on 127.0.0.1:8080 serves passes through: the SPA at /app/,
# the API at /api/, the hashed assets, the policy pages. The one thing this name does
# not do is show the landing at its root: that page lives at joinorbiters.com/pigrocrm,
# so a visitor who types the CRM's name lands in the CRM.
#
# TLS is added by `certbot --nginx`, which rewrites this file in place.

server {
    listen 80;
    listen [::]:80;
    server_name pigro.joinorbiters.com;

    absolute_redirect off;

    # The root installation's own space name (PIGROCRM_ROOT_SLUG=humancraft on this
    # server): the bare host and the unprefixed login land there, so the titolare's CRM
    # has an address shaped like everyone else's. Deep links and assets under /app/ keep
    # working unprefixed -- the same SPA, the same database.
    location = /          { return 302 /humancraft/app/; }
    location = /app       { return 302 /humancraft/app/; }
    # Every page under /app/ moves under the root's name, so the address always says
    # whose CRM this is; the bundle's assets and the tab icon are not pages, and the
    # login and the signup are the two pages that stay bare on purpose (2026-09-09): a
    # person who has just logged out, or who is creating a space, is nobody's yet and
    # must not read a space's name in the address. The root's cookies live at `/`, so
    # a session opened on the bare login is the same session under /humancraft/app.
    location = /app/login {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/orbiters-proxy.conf;
    }
    location = /app/registrati {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/orbiters-proxy.conf;
    }
    location ^~ /app/assets/ {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/orbiters-proxy.conf;
    }
    location = /app/mark.svg {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/orbiters-proxy.conf;
    }
    location ^~ /app/ { return 302 /humancraft$request_uri; }

    # The Google OAuth flow starts from a plain `/api/.../oauth/start` anchor and comes
    # back to the registered `/api/.../oauth/callback`; both need the session cookie,
    # which is scoped to /humancraft/. Moving the four under the root's name is what
    # lets the cookie travel (2026-09-09). A space's own callback is registered with its
    # prefix and never lands here.
    location = /api/gmail/oauth/start    { return 302 /humancraft$request_uri; }
    location = /api/gmail/oauth/callback { return 302 /humancraft$request_uri; }
    location = /api/drive/oauth/start    { return 302 /humancraft$request_uri; }
    location = /api/drive/oauth/callback { return 302 /humancraft$request_uri; }

    location / {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/orbiters-proxy.conf;
    }
}
