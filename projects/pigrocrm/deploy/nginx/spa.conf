server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # 127.0.0.11 is Docker's own embedded DNS server, reachable at that fixed
    # address inside every container on a user-defined bridge network (which is
    # what `docker compose` creates for this stack) -- not the host's resolver, and
    # not optional. Without an explicit `resolver`, nginx resolves a `proxy_pass`
    # hostname exactly once, at config load, and caches that IP for the worker
    # process's entire lifetime. `docker compose up -d --build` only recreates the
    # services whose image actually changed: a backend-only change gives the `api`
    # container a new IP on the compose network while this `web` container keeps
    # running unchanged, still proxying to the address `api` had before the
    # redeploy -- every request 502s until `web` itself is also restarted, with
    # nothing about the deploy step itself failing or logging why. `valid=10s`
    # bounds how long a resolution is trusted before nginx re-asks, so a redeployed
    # `api` is reachable again within seconds, not only after `web`'s own restart.
    resolver 127.0.0.11 valid=10s;

    # Relative `Location` headers on every redirect below. Without this nginx builds
    # an absolute URL from `$scheme://$host` and **drops a non-default port**:
    # measured against this very image, `curl http://127.0.0.1:8080/login` answered
    # `302 -> http://127.0.0.1/app/login`, sending the browser to port 80. Invisible
    # behind a reverse proxy on 80/443, which is why it would have shipped -- and
    # broken for anyone reaching the container directly, which is exactly how the
    # compose stack is reached in development and in the README's own quick start.
    # A relative Location is correct under every scheme, host and port at once.
    absolute_redirect off;

    # This image is the application and nothing else since 2026-09-09: the public
    # pages moved to their own project and their own container, and the host sends
    # joinorbiters.com there. The document root therefore holds only /app, so the
    # bare root is a redirect into the application rather than a page.
    #
    # `= /app` earns its line: without it the bare path never enters the `^~ /app/`
    # prefix block below and falls through to the catch-all.
    location = /            { return 302 /app/; }
    location = /app         { return 302 /app/; }
    location = /login       { return 302 /app/login; }   # old links do not die

    # Client-side routing, now scoped: an unknown path under /app/ is a route, not a
    # missing file, so a refresh on a deep link like /app/clienti/<uuid> re-serves
    # the SPA shell. Scoping it to `^~ /app/` is what stops that fallback from also
    # swallowing `/`, which is the whole reason this block changed.
    location ^~ /app/       { try_files $uri /app/index.html; }

    # Spaces (spec 2026-09-08): `/<slug>/app/...` is the same SPA shell -- its assets stay
    # absolute under /app/ -- and the SPA reads the prefix from the URL; `/<slug>/api/...`
    # and `/<slug>/health` go to the API with the full path, whose middleware strips the
    # prefix. Regex locations lose to the exact and `^~` ones above, so `/`, `/app/`
    # and `/login` keep winning even though they would match here. Since the public
    # pages left this image, a bare `/privacy` reaching this container directly is
    # read as a space name and redirects to /privacy/app/; on the server it never
    # gets here, because the host redirects those four paths to joinorbiters.com.
    # Quoted, and not by taste: a regex with `{1,30}` in it is a block opener to nginx's
    # parser unless it is a string -- the unquoted form fails `nginx -t` with
    # "unexpected end of file" and took the container down with it.
    location ~ "^/[a-z0-9][a-z0-9-]{1,30}[a-z0-9]/app(/|$)" { try_files /app/index.html =404; }
    location ~ "^/[a-z0-9][a-z0-9-]{1,30}[a-z0-9]/(api|health)(/|$)" {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ "^/([a-z0-9][a-z0-9-]{1,30}[a-z0-9])$" { return 302 /$1/app/; }

    # Anything else: a bare 404 rather than an SPA fallback. Nothing but /app now
    # lives under the document root, so this is the honest answer.
    location / {
        try_files $uri =404;
    }

    location /api/ {
        # A `proxy_pass` target is only re-resolved per-request, honouring the
        # `resolver` above, when it is a *variable* -- a literal hostname here
        # (`http://api:8000/api/`, this block's own value until this fix) is
        # resolved once at config load regardless of any `resolver` directive
        # being present at all.
        #
        # `$request_uri`, not a literal `/api/` (or nothing): nginx's own docs on
        # `proxy_pass` are explicit that a *static* URI after the host, in a
        # prefix `location`, replaces the matched location prefix (here, `/api/`
        # replaced by `/api/` -- a no-op that forwards the full original path,
        # e.g. `/api/customers/abc` stays `/api/customers/abc`) -- but the moment
        # the directive contains a variable, that prefix-substitution does not
        # happen at all; whatever URI is written is instead sent to the upstream
        # verbatim, in place of the original request URI (confirmed against
        # nginx.org's own documented example, `proxy_pass http://127.0.0.1$request_uri;`,
        # which re-supplies it explicitly for exactly this reason). Writing a
        # literal `/api/` here instead -- the natural-looking equivalent of the
        # static version above -- would have sent every request to that same bare
        # path regardless of the real one, silently breaking every route under
        # `/api/` except the prefix itself. `$request_uri` is what actually
        # reproduces the static form's behaviour, now resolved per-request.
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # apps/api/src/pigrocrm_api/main.py registers this probe at the bare path
    # `/health`, not under `/api/` (every real router in apps/api/src/pigrocrm_api/
    # routers/*.py prefixes itself with `/api/...`; this one intentionally does
    # not, since it exists for the deployment layer, not the SPA). An exact-match
    # location is required here -- folding it into the `/api/` prefix block above
    # would forward a request for it to `/api/health` upstream, a path the
    # backend does not serve (verified by reading main.py's route registration
    # and the generated OpenAPI schema, both of which list only `/health`), so
    # this stack's own verification curls this exact-match path, not `/api/health`.
    location = /health {
        # Same stale-IP risk as `/api/` above, same fix, same `$request_uri`
        # reasoning -- this is an exact-match location, but the same nginx rule
        # still applies once a variable is involved.
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream$request_uri;
    }
}
