# No `mcp` service here, on purpose: apps/mcp speaks MCP over stdio (see its own
# __main__.py -- `build_server(...).run("stdio")`), meant to be launched as a
# subprocess by an MCP client (Claude Desktop/Code) that owns its stdin/stdout for
# the life of one session, not run as a long-lived network daemon. `docker compose
# up -d` has no such client to attach; the container would just sit there with
# nothing ever writing to its stdin. Its code already ships inside the `api` image
# built below -- Dockerfile.api COPYs and `uv sync`s apps/mcp too -- so an operator
# who wants Claude talking to this deployment's data runs it on demand instead,
# with a personal access token minted from Impostazioni -> Token in the UI:
#   docker compose run --rm -e PIGROCRM_TOKEN=<token> api uv run --no-sync python -m pigrocrm_mcp
# (`run`, not `exec` into the already-detached `api` container, so this process
# gets its own stdio actually connected to whatever launched this command --
# typically an MCP client's own "command"/"args" configuration over SSH.)
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pigrocrm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?serve una password}
      POSTGRES_DB: ${POSTGRES_DB:-pigrocrm}
    # Data on the host, never in a Docker-managed volume: a `docker system prune`,
    # a Docker Desktop reset or a reinstall must not be able to take the register with
    # them (decision of 2026-09-04, after a daemon reset scared everyone). Set
    # PIGROCRM_DATA_DIR to a directory outside the repository, e.g. ~/pigrocrm-data/postgres.
    #
    # The default is written `../../data/postgres` rather than `./data/postgres`
    # because compose resolves a relative volume against the directory of this file,
    # and this file moved down two levels when the repository became a monorepo. The
    # two dots keep the default pointing at exactly the same directory on an existing
    # server as before the move -- an installation that never set PIGROCRM_DATA_DIR
    # would otherwise come back up against an empty data directory, with a working
    # Postgres, no error anywhere, and its register apparently gone.
    volumes:
      - ${PIGROCRM_DATA_DIR:-../../data/postgres}:/var/lib/postgresql/data
    ports:
      - '${PIGROCRM_DB_PORT:-127.0.0.1:55432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-pigrocrm}']
      interval: 5s
      retries: 10

  api:
    build:
      # The repository root, because both the uv workspace (pyproject.toml, uv.lock)
      # and the pnpm workspace (package.json, pnpm-lock.yaml) live there and the
      # image needs the lockfile it is pinned by.
      context: ../..
      dockerfile: projects/pigrocrm/Dockerfile.api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PIGROCRM_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pigrocrm}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pigrocrm}
      PIGROCRM_JWT_SECRET: ${PIGROCRM_JWT_SECRET:?serve un secret}
      # The installation's own choices, forwarded by name with the code's own defaults
      # (packages/core/src/pigrocrm/core/config.py) so an `.env` that leaves them out
      # gets exactly what a bare `Settings()` would. Booleans and the enum default to a
      # literal, never to an empty string, which pydantic would refuse at start-up.
      PIGROCRM_TIMEZONE: ${PIGROCRM_TIMEZONE:-Europe/Rome}
      PIGROCRM_MCP_FULL_ACCESS: ${PIGROCRM_MCP_FULL_ACCESS:-false}
      PIGROCRM_STORAGE_BACKEND: ${PIGROCRM_STORAGE_BACKEND:-local}
      PIGROCRM_GDRIVE_SERVICE_ACCOUNT_JSON: ${PIGROCRM_GDRIVE_SERVICE_ACCOUNT_JSON:-}
      PIGROCRM_GDRIVE_ROOT_FOLDER_ID: ${PIGROCRM_GDRIVE_ROOT_FOLDER_ID:-}
      # Gmail and Drive (slice 5, 9): all four or none, as .env.example says. With
      # `google_accounts` rows in the database and no PIGROCRM_GOOGLE_TOKEN_KEY, the API
      # refuses to boot rather than hold tokens it cannot decrypt.
      PIGROCRM_GOOGLE_CLIENT_ID: ${PIGROCRM_GOOGLE_CLIENT_ID:-}
      PIGROCRM_GOOGLE_CLIENT_SECRET: ${PIGROCRM_GOOGLE_CLIENT_SECRET:-}
      PIGROCRM_GOOGLE_TOKEN_KEY: ${PIGROCRM_GOOGLE_TOKEN_KEY:-}
      PIGROCRM_PUBLIC_URL: ${PIGROCRM_PUBLIC_URL:-}
      PIGROCRM_GOOGLE_APP_UNVERIFIED: ${PIGROCRM_GOOGLE_APP_UNVERIFIED:-false}
      PIGROCRM_ORBITERS_DATABASE_URL: ${PIGROCRM_ORBITERS_DATABASE_URL:-}
      PIGROCRM_ROOT_SLUG: ${PIGROCRM_ROOT_SLUG:-}
      # PIGROCRM_COOKIE_SECURE is deliberately NOT set here -- do not add it.
      # .env (this same file, shared with the plain `uv run uvicorn`/`uv run pytest`
      # local-dev flow) carries PIGROCRM_COOKIE_SECURE=false for that flow's own
      # reason (see .env.example). Compose only forwards the variables a service's
      # `environment:` block names explicitly; it does not leak every key of `.env`
      # into every container. Leaving this key out means the api container always
      # gets Settings' own compiled-in default (cookie_secure=True), regardless of
      # what the local-dev section of `.env` says -- which is exactly what a real
      # deployment needs, and is the one thing that must NOT be copied from dev to
      # production. If a future change ever pipes ${PIGROCRM_COOKIE_SECURE} through
      # to this service, it re-opens that hole: `docker compose up` with an
      # unmodified `.env.example`-derived `.env` would then silently serve cookies
      # without `Secure`.
    # Where `PIGROCRM_STORAGE_BACKEND=local` writes documents (config.py's
    # `storage_local_root`, ./var/documents under the image's WORKDIR /app). On the
    # host, like the database above, so a rebuilt container keeps every PDF -- and
    # written `../../` for the same reason as the database volume above.
    volumes:
      - ${PIGROCRM_DOCUMENTS_DIR:-../../var/documents}:/app/var/documents

  web:
    build:
      context: ../..
      dockerfile: projects/pigrocrm/Dockerfile.web
    restart: unless-stopped
    depends_on: [api]
    ports:
      # Overridable so a second environment (preview) can run the same stack on the
      # same host without fighting for the port. Bound to the loopback in both cases:
      # nginx on the host is what faces the internet, and publishing to 0.0.0.0 would
      # walk straight past the firewall.
      - '${PIGROCRM_WEB_PORT:-127.0.0.1:8080}:80'

