[project]
name = "pigrocrm"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["pigrocrm-core", "pigrocrm-api", "pigrocrm-mcp"]

[tool.uv.workspace]
members = ["packages/*", "apps/api", "apps/mcp"]

[tool.uv.sources]
pigrocrm-core = { workspace = true }
pigrocrm-api = { workspace = true }
pigrocrm-mcp = { workspace = true }

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "pytest-asyncio==1.4.0",
  "testcontainers[postgres]==4.15.0",
  "httpx==0.28.1",
  "ruff==0.16.1",
  "mypy==2.3.0",
  "lxml-stubs==0.5.1",
  # openpyxl ships no inline types, so under `strict` every `from openpyxl import ...`
  # is an `import-untyped` error and the whole workbook builder degrades to `Any` --
  # which is exactly where a wrong `number_format` or a misspelled attribute would
  # hide. Same reason `lxml-stubs` is here. Only a dev dependency: stubs are read by
  # mypy, never imported at runtime, so they have no business in core's own
  # `[project].dependencies` (and the architecture test reads that list literally).
  "types-openpyxl==3.1.5.20260807",
]

[tool.pytest.ini_options]
testpaths = ["packages/core/tests", "apps/api/tests", "apps/mcp/tests"]
asyncio_mode = "auto"
# Nothing skips on this marker by default. It exists so a developer can say
# `-m "not slow"` while iterating, and so CI's own `uv run pytest -q` still runs it: a
# plan assertion that CI skips is a plan assertion that does not exist.
markers = [
  "slow: builds the 50 000-row inflated corpus; minutes, not seconds",
]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = ["packages/core/src", "apps/api/src", "apps/mcp/src"]
explicit_package_bases = true
# Matches .github/workflows/*.yml's own `uv run mypy packages/core/src apps/api/src
# apps/mcp/src` exactly, so the bare `uv run mypy` gate this repo's own task briefs
# name actually passes instead of failing on "Missing target module, package, files,
# or command" every time -- a gate that always fails trains people to read failure as
# normal, and read a real one as more of the same.
files = ["packages/core/src", "apps/api/src", "apps/mcp/src"]
