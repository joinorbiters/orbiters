# joinorbiters.com -- the host vhost in front of the website container.
#
# The website ships as its own compose stack (docker-compose.yml here) listening on
# 127.0.0.1:8082, and that container owns the whole path map: which extensionless path
# is which page, and a 404 for anything else. This file terminates TLS and decides only
# the three paths that do **not** belong to it:
#
#   * `/api/orbiters/signups`, the endpoint the Orbiters form posts to, which since
#     2026-09-09 is the Orbiters hub's own API (projects/hub, 127.0.0.1:8084) and no
#     longer PigroCRM's. Same origin for
#     the browser, two containers behind it.
#   * `/health`, the API's probe, for the same reason.
#   * `/app`, which is the CRM: it lives on pigro.joinorbiters.com and this name only
#     points at it.
#
# TLS is added by `certbot --nginx`, which rewrites this file in place on the server.
# The copy here is the plain-HTTP source of truth; the copy in
# /etc/nginx/sites-available/ has certbot's 443 block on top of it and is edited in
# place rather than overwritten, or TLS disappears on the next change.

server {
    listen 80;
    listen [::]:80;
    server_name www.joinorbiters.com;
    return 301 https://joinorbiters.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name joinorbiters.com;

    absolute_redirect off;
    client_max_body_size 1M;

    # PigroCRM's stack, on this name, for exactly two paths.
    location = /api/orbiters/signups {
        proxy_pass http://127.0.0.1:8084/api/orbiters/signups;
        include /etc/nginx/snippets/orbiters-proxy.conf;
    }
    location = /health {
        proxy_pass http://127.0.0.1:8080/health;
        include /etc/nginx/snippets/orbiters-proxy.conf;
    }

    # "Accedi" on both pages: the CRM answers on its own name.
    location = /app  { return 302 https://pigro.joinorbiters.com/app/; }
    location /app/   { return 302 https://pigro.joinorbiters.com$request_uri; }

    # Everything else is the website container, which decides what exists.
    location / {
        proxy_pass http://127.0.0.1:8082;
        include /etc/nginx/snippets/orbiters-proxy.conf;
    }
}
