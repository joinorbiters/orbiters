# The website's own nginx, inside its own image. Four pages and their assets, and
# nothing else: no SPA fallback, no API, no proxy. What this file decides is which
# extensionless path maps to which file, which is the same mapping
# `src/path-map-plugin.ts` reproduces for the dev and preview servers. Its unit test
# parses the `location =` lines below, so a change to one and not the other fails
# there instead of passing locally and 404ing in production.
#
# The host's nginx (deploy/nginx/joinorbiters.conf) terminates TLS and sends
# everything here except the signup endpoint and the health probe, which belong to
# PigroCRM's API and stay on its stack.
server {
    listen 80;
    root /usr/share/nginx/html;

    # Relative Location headers. Without this nginx builds an absolute URL from
    # $scheme://$host and drops a non-default port, so a redirect reached directly on
    # 127.0.0.1:8082 sends the browser to port 80. Invisible behind the reverse proxy,
    # broken for anyone curling the container, which is how it is verified.
    absolute_redirect off;

    # The community page is the site's front door; PigroCRM's own page sits beside it
    # under a name. `/orbiters` existed before that decision and still resolves.
    location = /         { try_files /orbiters.html =404; }
    location = /orbiters { return 301 /; }
    location = /pigrocrm { try_files /index.html =404; }
    location = /privacy  { try_files /privacy.html =404; }
    location = /termini  { try_files /termini.html =404; }

    # The hashed CSS, JS and the woff2 the build emitted, and nothing invented.
    location /assets/ { try_files $uri =404; }

    # No `try_files $uri` fallback at the root on purpose: a static site that answers
    # 200 for a file nobody linked is a site whose 404s you never see.
    location / { return 404; }
}
